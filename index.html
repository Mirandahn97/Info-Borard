<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="Assets/Js/Main.js"></script>
    <link rel="stylesheet" href="Assets/css/main.css">
    <title>(Sanne)Opslagstavle WEB</title>
</head>
<script src="Assets/Js/Modules/Vejr/vejr-og-data.js"></script>
<script type="module">
        import { init } from './Assets/Js/Modules/Rejseplan/Rejseplans.js';
        document.addEventListener('DOMContentLoaded', () => init('busplan'));
</script>
 <style>

                #color-palette {
                position: fixed;
                left: 16px;
                bottom: 16px;
                display: flex;
                align-items: center;

                gap: 10px;
                background: rgba(255,255,255,0.92);
                padding: 8px 10px;
                border-radius: 10px;
                box-shadow: 0 6px 18px rgba(0,0,0,0.12);

                z-index: 9999;
                font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
                font-size: 12px;
                color: #222;

            }


            #color-palette .swatches { display:flex; gap:6px; align-items:center }
            #color-palette .swatch { width:26px; height:26px; border-radius:6px; border:1px solid rgba(0,0,0,0.08); box-shadow: inset 0 -1px 0 rgba(0,0,0,0.06); }
            #color-palette .lbl { margin-left:6px; color:#444 }

            #color-palette img.palette-train { width:32px; height:auto; display:block; margin-left:6px }
            @media (max-width:480px){ #color-palette{ left:8px; bottom:8px; padding:6px } }

        </style>
<body>
    <main>



        <section id="skema"></section>
        <section id="midten">
            <section id="ur-container">
                <section id="ur">00:00</section>
            </section>

            <section id="opslagstavle"></section>
            <section id="ur"></section>
            <section class="container-opslagstavle">
                <section id="news"><h2>Opslagstavle</h2></section>
            </section>
            <section id="kantinen"></section>
        </section>
        <section id="højre">
            <section id="busplan"></section>
            <section id="vejr"></section>
        </section>
                <div id="color-palette" aria-hidden="true">
            <div class="swatches" title="Color palette">

                <span class="swatch" style="background:#F5D45B" aria-label="gul"></span>
                <span class="swatch" style="background:#D14938" aria-label="rod"></span>

            </div>
            <img class="palette-train" src="assets/img/TRAIN.png" alt="Train icon">
        </div>
                <div class="transport-bottom" aria-hidden="true">
            <img src="assets/img/bus-simple.svg" alt="Bus" class="icon-bus">
            <img src="assets/img/TRAIN.png" alt="Train" class="icon-train">
        </div>
    </main>
</body>

</html>
